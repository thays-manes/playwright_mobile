name: Mobile tests (Android)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *' # todo dia, 2h no horário de Brasília
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O emulador Android precisa de KVM (aceleração de hardware)
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar dependências
        run: |
          npm install
          npx appium driver install uiautomator2

      # O .apk não fica no repositório. Defina a variável APP_URL em
      # Settings > Secrets and variables > Actions > Variables.
      - name: Baixar o app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Defina a variável APP_URL com o link do .apk" >&2
            exit 1
          fi
          mkdir -p apps/android
          curl -fsSL -o apps/android/android.wdio.native.app.apk "$APP_URL"

      - name: Rodar testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: Pixel_7_API_34
          disable-animations: true
          script: npm run test:android

      - name: Gerar relatório Allure
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: |
            allure-report
            allure-results
            screenshots
            logs
          if-no-files-found: ignore
